name: Release Atlas Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14   # Apple Silicon runner
            target: aarch64-apple-darwin
          - platform: macos-13   # Intel runner
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev libpulse-dev pkg-config

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Atlas remote agent URL — baked into the desktop build at compile time.
          # The Tauri Rust core reads ATLAS_AGENT_URL from env; the frontend
          # reads NEXT_PUBLIC_AGENT_URL.
          ATLAS_AGENT_URL: ${{ secrets.ATLAS_AGENT_URL }}
          NEXT_PUBLIC_AGENT_URL: ${{ secrets.ATLAS_AGENT_URL }}
          # macOS code signing — set these in repo Secrets when ready.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri auto-updater signing (run `cargo tauri signer generate` once)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Atlas ${{ github.ref_name }}'
          releaseBody: 'Atlas desktop release. See CHANGELOG.md for what changed.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
